<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>offread</title>
    <link rel="stylesheet" href="viewer.css">
    <script src="viewer.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div>
        <div class="eyebrow">offread</div>
        <h1 id="page-title">Saved page</h1>
        <p id="page-meta" class="meta">Snapshot viewer</p>
      </div>
      <button id="resnap" type="button">Close viewer</button>
    </header>
    <main class="layout">
      <aside class="sidebar">
        <h2>Snapshots</h2>
        <div id="snapshot-list" class="snapshot-list"></div>
      </aside>
      <section class="reader">
        <iframe id="snapshot-frame" title="Saved page" sandbox=""></iframe>
      </section>
    </main>
  </body>
</html>
